# Model allow-list (docs/ai/AI_ARCHITECTURE.md §4).
# The admin UI only offers these models and the API rejects others.
# Before adding a model, check the provider's deprecation schedule; set
# deprecated_at (YYYY-MM-DD) when a shutdown is announced: from that date the
# model can't be newly selected (existing agents keep working until changed).
models:
