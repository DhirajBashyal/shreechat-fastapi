[project]
name = "embedding-service"
version = "0.1.0"
description = "Embedding service for Shree Chat AI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "python-json-logger>=3.3.0",
    "uvicorn>=0.35.0",
    "torch>=2.7.0",
    "pydantic-settings>=2.10.1",
    "sentence-transformers>=5.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy==1.17.0",
    "ruff==0.12.3",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["E501"]
extend-select = ["E", "I", "F", "G", "N", "T201"]
