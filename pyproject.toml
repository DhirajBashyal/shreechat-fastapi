[project]
name = "shreechat-ai-fastapi"
version = "0.1.0"
description = "Shree Chat AI FastAPI application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "gunicorn>=23.0.0",
    "pydantic-settings>=2.10.1",
    "python-json-logger>=3.3.0",
    "uvicorn>=0.35.0",
    "alembic>=1.16.4",
    "sqlalchemy>=2.0.41",
    "asyncpg>=0.30.0",
    "httpx>=0.28.1",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.2.9",
    "slowapi>=0.1.9",
    "redis[hiredis]>=6.4.0",
    "greenlet>=3.2.3",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "mypy==1.17.0",
    "pytest>=8.4.1",
    "ruff==0.12.3",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true


[tool.ruff.lint]
ignore = ["E501"]
extend-select = ["E", "I", "F", "G", "N", "T201"]
